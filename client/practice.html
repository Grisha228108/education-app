                <p class="progress-text"></p>
            </div>
            
            <!-- <h3 class="nav-title">Темы</h3>

                </div>    -->

                <div class="buttons">

                </div>

            </div>

                <button class="btn next-btn">Дальше</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-link" id="prev-question">← Назад</button>
        <span class="page-counter">4/10</span>
        <button class="nav-link" id="next-question">Вперёд →</button>
